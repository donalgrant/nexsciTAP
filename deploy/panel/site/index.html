<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive in a Box control panel</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --quiet: #6b6963; --rule: #e4e2dc; --edge: #cfccc4;
  --accent: #2f6fd0; --accent-soft: #e4edfb; --good: #1f9d55; --good-soft: #e2f4e8;
  --warn: #c77700; --warn-soft: #fbf0db; --bad: #c0392b; --bad-soft: #fbe6e3; --idle: #8a8780;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171716; --card: #1f1f1d; --ink: #ecebe7; --quiet: #a09d95; --rule: #2e2d2a; --edge: #3c3b37;
    --accent: #6ea3f2; --accent-soft: #1d2b42; --good: #4cc27e; --good-soft: #17301f;
    --warn: #e2a13c; --warn-soft: #382a10; --bad: #ee7b6c; --bad-soft: #3a1b17; --idle: #7d7a73;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--rule); padding: 14px 24px 0; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; min-width: 220px; }
.pill { border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; border: 1px solid; white-space: nowrap; }
.pill.running { color: var(--good); background: var(--good-soft); border-color: var(--good); }
.pill.standby, .pill.unknown { color: var(--idle); background: transparent; border-color: var(--edge); }
.pill.starting { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
.pill.down, .pill.failing { color: var(--bad); background: var(--bad-soft); border-color: var(--bad); }
.stage { font-size: 12px; color: var(--quiet); }
button, select, input { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--edge);
       border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.go { border-color: var(--accent); background: var(--accent-soft); }
button.sm { padding: 1px 9px; }
label.d { margin-right: 10px; white-space: nowrap; }
.form { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: 80vw; display: none; z-index: 5; }
nav { display: flex; gap: 22px; margin-top: 12px; overflow-x: auto; }
nav a { padding: 6px 0 9px; color: var(--quiet); text-decoration: none; border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; }
nav a.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
main { padding: 20px 24px 40px; max-width: 1180px; margin: 0 auto; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 820px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2, .g11 { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
.label { font-size: 12.5px; color: var(--quiet); }
.big { font-size: 24px; font-weight: 600; margin: 2px 0; display: flex; align-items: center; gap: 8px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: var(--idle); }
.dot.ok { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.note { font-size: 12.5px; color: var(--quiet); }
.gap { margin-top: 16px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 400; color: var(--quiet); font-size: 12.5px; padding: 4px 10px 6px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.q { max-width: 520px; overflow-wrap: anywhere; color: var(--ink); }
.warnText { color: var(--warn); } .badText { color: var(--bad); } .goodText { color: var(--good); }
.notice { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 9px 12px; margin-bottom: 16px; font-size: 13px; }
.notice.err { background: var(--bad-soft); border-color: var(--bad); }
.meter { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.row { display: grid; grid-template-columns: 90px 1fr 70px; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
.row span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; }
.bars rect { fill: var(--accent); opacity: .8; } .bars rect.f { fill: var(--bad); opacity: .9; }
.axis { stroke: var(--edge); } .gridline { stroke: var(--rule); } .tick { fill: var(--quiet); font-size: 11px; }
.line { fill: none; stroke: var(--accent); stroke-width: 1.6; } .line.b { stroke: var(--warn); }
.strip { display: flex; gap: 2px; height: 22px; align-items: stretch; }
.strip i { flex: 1; border-radius: 2px; background: var(--good); min-width: 2px; }
.strip i.bad { background: var(--bad); } .strip i.skip { background: var(--edge); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
       max-height: 62vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.log .t { color: var(--quiet); } .log .c { color: var(--accent); }
footer { color: var(--quiet); font-size: 12px; text-align: center; padding: 0 24px 28px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Archive in a Box&ensp;control panel</h1>
    <span id="pill" class="pill unknown">checking</span>
    <button id="power" hidden></button>
    <span id="whoami" class="stage"></span><button id="signout" hidden>Sign out</button>
    <button id="refresh" title="Read everything again">Refresh</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<div id="toast"></div>

<script>
'use strict';
const TABS = ['Status', 'Activity', 'Load', 'Datasets', 'Cost', 'Components', 'Watch', 'Logs', 'Record'];
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = (v) => v == null ? '' : Number(v).toLocaleString('en-US');
const bytes = (b) => { if (b == null) return ''; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < 4) { b /= 1000; i++; } return (b >= 100 || i === 0 ? b.toFixed(0) : b.toFixed(1)) + ' ' + u[i]; };
const money = (v) => v == null ? '' : '$' + Number(v).toFixed(2);
const ms = (v) => v == null ? '' : v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + ' s' : v + ' ms';
const clock = (t) => t ? new Date(t * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
const day = (t) => t ? new Date(t * 1000).toLocaleDateString([], {month: 'short', day: 'numeric'}) : '';
const when = (t) => t ? day(t) + ' ' + clock(t) : '';
const ago = (t) => { if (!t) return ''; const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? Math.round(s) + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };

let tab = (location.hash || '#Status').slice(1);
if (!TABS.includes(tab)) tab = 'Status';
const store = {};

// ---- sign-in --------------------------------------------------------------
// The page holds an access token from Cognito for this tab only, and sends it with each request.
let CONFIG = null;
const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const token = () => sessionStorage.getItem('panelToken') || '';
async function goSignIn() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('pkce', verifier); sessionStorage.setItem('oauthState', state); sessionStorage.setItem('afterSignIn', location.hash);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.assign(`https://${CONFIG.host}/oauth2/authorize?` + new URLSearchParams({response_type: 'code', client_id: CONFIG.client, redirect_uri: CONFIG.returnTo,
    scope: 'openid email aws.cognito.signin.user.admin', state, code_challenge: challenge, code_challenge_method: 'S256'}));
  return new Promise(() => {});          // the page is leaving
}
async function signIn() {
  CONFIG = await (await fetch('/api/config', {cache: 'no-store'})).json();
  if (!CONFIG.signIn) return;
  const q = new URLSearchParams(location.search);
  if (q.get('code')) {
    const ok = q.get('state') && q.get('state') === sessionStorage.getItem('oauthState');
    const r = ok && await fetch(`https://${CONFIG.host}/oauth2/token`, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type: 'authorization_code', client_id: CONFIG.client, code: q.get('code'), redirect_uri: CONFIG.returnTo, code_verifier: sessionStorage.getItem('pkce') || ''})});
    const t = r && r.ok ? await r.json() : null;
    sessionStorage.removeItem('pkce'); sessionStorage.removeItem('oauthState');
    if (t && t.access_token) sessionStorage.setItem('panelToken', t.access_token);
    history.replaceState(null, '', location.pathname + (sessionStorage.getItem('afterSignIn') || ''));
    if (!t) { $('#main').innerHTML = '<div class="notice err">Sign-in did not complete.  <a href="/">Try again</a></div>'; return new Promise(() => {}); }
  } else if (q.get('error')) {
    $('#main').innerHTML = `<div class="notice err">Sign-in was refused:  ${esc(q.get('error_description') || q.get('error'))}.  <a href="/">Try again</a></div>`;
    return new Promise(() => {});
  }
  if (!token()) return goSignIn();
  const out = $('#signout'); out.hidden = false;
  out.onclick = () => { sessionStorage.removeItem('panelToken'); location.assign(`https://${CONFIG.host}/logout?` + new URLSearchParams({client_id: CONFIG.client, logout_uri: CONFIG.returnTo})); };
}
const withToken = (headers) => (token() ? Object.assign({'X-Panel-Token': token()}, headers || {}) : (headers || {}));
async function answer(r) {
  if (r.status === 401 && CONFIG && CONFIG.signIn) { sessionStorage.removeItem('panelToken'); await goSignIn(); }
  const body = await r.json().catch(() => ({error: 'The panel could not read the answer (' + r.status + ').'}));
  if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
  if (body.user) $('#whoami').textContent = body.user;
  return body;
}

async function api(name, params) {
  const qs = params ? '?' + new URLSearchParams(params) : '';
  return answer(await fetch('/api/' + name + qs, {cache: 'no-store', headers: withToken()}));
}
async function get(name, params, fresh) {
  const key = name + JSON.stringify(params || {});
  if (!fresh && store[key] && Date.now() - store[key].at < 60000) return store[key].v;
  const v = await api(name, params);
  store[key] = {v, at: Date.now()};
  return v;
}

async function post(body) {
  const text = JSON.stringify(body);
  const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)))).map((b) => b.toString(16).padStart(2, '0')).join('');
  // CloudFront signs what it passes to the functions, and for a request with a body it needs the body's hash from us.
  return answer(await fetch('/api/control', {method: 'POST', cache: 'no-store', body: text,
    headers: withToken({'Content-Type': 'application/json', 'X-Panel': '1', 'x-amz-content-sha256': hash})}));
}
let toastTimer;
function toast(text) { const t = $('#toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 6000); }
async function act(body, done) {
  try { const out = await post(body); for (const k in store) delete store[k]; toast(done(out)); show(true); }
  catch (e) { toast('Not done:  ' + e.message); }
}
async function setTasks(count, current) {
  if (count === current) return;
  if (count === 0) {
    let jobs = [];
    try { jobs = (await api('jobs')).jobs; } catch (e) { /* no list; ask anyway */ }
    const lost = jobs.length ? `\n\n${jobs.length} async job${jobs.length === 1 ? ' is' : 's are'} running and will be lost.` : '';
    if (!confirm('Put the service in standby?\n\nUsers will see a page saying the archive is paused until it is started again.' + lost)) return;
  } else if (count > current && !confirm(`Run ${count} task${count === 1 ? '' : 's'}?  Each task costs about $2.80 a day.`)) return;
  act({action: 'tasks', count}, (o) => count === 0 ? 'Standby:  the task is stopping.' : current === 0 ? 'Starting.  The service answers again in a few minutes.' : `Now asking for ${count} task${count === 1 ? '' : 's'}.`);
}

function nav() {
  $('#nav').innerHTML = TABS.map((t) => `<a class="${t === tab ? 'on' : ''}" data-t="${t}">${t}</a>`).join('');
}
$('#nav').addEventListener('click', (e) => { const t = e.target.dataset.t; if (t) { tab = t; location.hash = t; nav(); show(); } });
$('#refresh').addEventListener('click', () => { for (const k in store) delete store[k]; show(true); });

function pill(s) {
  const words = {running: 'Running', standby: 'Standby', starting: 'Starting', down: 'Down', failing: 'Failing checks'};
  const p = $('#pill');
  p.className = 'pill ' + (words[s.state] ? s.state : 'unknown');
  p.textContent = (words[s.state] || 'Unknown') + (s.state === 'standby' ? '' : ', ' + s.running + (s.running === 1 ? ' task' : ' tasks'));
  const b = $('#power');
  b.hidden = false;
  b.textContent = s.desired === 0 ? 'Start the service' : 'Standby';
  b.className = s.desired === 0 ? 'go' : '';
  b.onclick = () => setTasks(s.desired === 0 ? Math.max(1, (s.schedule || {}).count || 1) : 0, s.desired);
  // While it starts, keep asking whether a task answers yet, so users get the service back promptly.
  clearTimeout(pill.timer);
  if (s.state === 'starting') pill.timer = setTimeout(async () => { try { await post({action: 'settle'}); } catch (e) { /* next time */ } for (const k in store) delete store[k]; show(true); }, 15000);
}

// ---- small charts ---------------------------------------------------------
function bars(perHour) {
  const W = 720, H = 150, n = perHour.length, top = Math.max(1, ...perHour.map((p) => p[1] + p[2]));
  const bw = (W - 40) / n;
  let s = `<svg viewBox="0 0 ${W} ${H + 22}" class="bars"><line class="axis" x1="34" x2="${W}" y1="${H}" y2="${H}"/>`;
  s += `<text class="tick" x="28" y="12" text-anchor="end">${top}</text><text class="tick" x="28" y="${H}" text-anchor="end">0</text>`;
  perHour.forEach((p, i) => {
    const x = 36 + i * bw, ok = p[1] / top * (H - 8), bad = p[2] / top * (H - 8);
    s += `<rect x="${x.toFixed(1)}" y="${(H - ok - bad).toFixed(1)}" width="${Math.max(1, bw - 3).toFixed(1)}" height="${ok.toFixed(1)}" rx="2"><title>${when(p[0])}: ${p[1]} answered, ${p[2]} failed</title></rect>`;
    if (bad) s += `<rect class="f" x="${x.toFixed(1)}" y="${(H - bad).toFixed(1)}" width="${Math.max(1, bw - 3).toFixed(1)}" height="${bad.toFixed(1)}" rx="2"/>`;
    if (i % Math.ceil(n / 8) === 0) s += `<text class="tick" x="${x.toFixed(1)}" y="${H + 16}">${n > 48 ? day(p[0]) : clock(p[0])}</text>`;
  });
  return s + '</svg>';
}
function lines(a, b, unit, fixedTop) {
  const W = 720, H = 130, all = (a || []).concat(b || []);
  if (!all.length) return '<p class="note">No measurements in this period.</p>';
  const t0 = Math.min(...all.map((p) => p[0])), t1 = Math.max(...all.map((p) => p[0])) || t0 + 1;
  const top = Math.min(fixedTop || Infinity, Math.max(fixedTop ? 10 : 0, Math.max(...all.map((p) => p[1])) * 1.15)) || 1;
  const X = (t) => 40 + (t - t0) / Math.max(1, t1 - t0) * (W - 44), Y = (v) => H - Math.min(v, top) / top * (H - 8);
  const path = (s) => s.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  let s = `<svg viewBox="0 0 ${W} ${H + 22}"><line class="axis" x1="38" x2="${W}" y1="${H}" y2="${H}"/><line class="gridline" x1="38" x2="${W}" y1="${Y(top / 2)}" y2="${Y(top / 2)}"/>`;
  s += `<text class="tick" x="34" y="12" text-anchor="end">${+top.toPrecision(2)}${unit}</text><text class="tick" x="34" y="${H}" text-anchor="end">0</text>`;
  for (let i = 0; i <= 6; i++) { const t = t0 + (t1 - t0) * i / 6; s += `<text class="tick" x="${X(t).toFixed(1)}" y="${H + 16}" text-anchor="${i === 6 ? 'end' : 'start'}">${t1 - t0 > 172800 ? day(t) : clock(t)}</text>`; }
  if (b && b.length) s += `<path class="line b" d="${path(b)}"/>`;
  if (a && a.length) s += `<path class="line" d="${path(a)}"/>`;
  return s + '</svg>';
}
const last = (s) => s && s.length ? s[s.length - 1][1] : null;
const total = (s) => (s || []).reduce((n, p) => n + p[1], 0);
const meter = (name, frac, text) => `<div class="row"><span class="label">${name}</span><div class="meter"><i style="width:${Math.max(0, Math.min(100, (frac || 0) * 100)).toFixed(0)}%"></i></div><span>${text}</span></div>`;
const tile = (label, big, note) => `<div class="card"><div class="label">${label}</div><div class="big">${big}</div><div class="note">${note || '&nbsp;'}</div></div>`;

function canaryTile(c) {
  if (!c.door) return tile('Service checks', '<span class="dot"></span>Not set up', 'the service does not admit the panel yet');
  const l = c.last;
  if (!l) return tile('Service checks', '<span class="dot"></span>No run yet', 'the canary runs every few minutes');
  if (l.skipped) return tile('Service checks', '<span class="dot"></span>Paused', l.skipped === 'standby' ? 'no checks while in standby' : l.skipped === 'starting' ? 'no checks while the service starts' : 'the service does not admit the panel yet');
  return tile('Service checks', `<span class="dot ${l.ok ? 'ok' : 'bad'}"></span>${l.ok ? 'Passing' : 'Failing'}`,
              `canary ${ago(l.at)}, ${ms(l.ms)}`);
}

// ---- views ----------------------------------------------------------------
const VIEW = {
  async Status(fresh) {
    const [s, load, cost, act, ds] = await Promise.all([
      get('status', null, fresh), get('load', {hours: 24}, fresh).catch((e) => ({error: e.message})),
      get('cost', null, fresh).catch((e) => ({error: e.message})),
      get('activity', {hours: 24}, fresh).catch((e) => ({error: e.message})),
      get('datasets', null, fresh).catch((e) => ({error: e.message}))]);
    pill(s);
    const today = cost.days ? cost.days[cost.days.length - 1] : null;
    const daily = (cost.budgets || []).find((b) => b.unit === 'DAILY');
    const hourAgo = Date.now() / 1000 - 3600;
    const lastHour = load.series ? (load.series.requests || []).filter((p) => p[0] >= hourAgo).reduce((n, p) => n + p[1], 0) : null;
    let h = '<div class="grid g4">';
    h += canaryTile(s.canary);
    h += tile('Tasks', s.running + (s.desired !== s.running ? ` <span class="note">of ${s.desired} wanted</span>` : '') +
              `<span style="flex:1"></span><button class="sm" id="tminus" ${s.desired <= 0 ? 'disabled' : ''} title="One task fewer">&minus;</button><button class="sm" id="tplus" ${s.desired >= s.taskCap ? 'disabled' : ''} title="One task more">+</button>`,
              'most allowed:  ' + s.taskCap);
    setTimeout(() => { const m = $('#tminus'), p = $('#tplus'); if (m) m.onclick = () => setTasks(s.desired - 1, s.desired); if (p) p.onclick = () => setTasks(s.desired + 1, s.desired); });
    h += tile('Requests, last hour', lastHour == null ? '?' : num(lastHour),
              act.recorded ? `${num(act.totals.queries)} queries in 24 h, ${num(act.totals.failed)} failed` : 'queries are not recorded yet');
    h += tile('Cost today', today ? money(today.total) : '?', (daily ? 'alarm at ' + money(daily.limit) + ';  ' : '') + 'whole account');
    h += '</div>';

    h += '<div class="grid g2 gap"><div class="card"><h2>' + (act.recorded ? 'Queries per hour, last 24 hours' : 'Requests, last 24 hours') + '</h2>';
    if (act.recorded) h += bars(act.perHour);
    else if (load.series) h += lines(load.series.requests, null, '') + '<p class="note">Requests reaching the load balancer, in 5-minute counts.  Query counts appear once the service records its queries.</p>';
    else h += `<p class="note">${esc(load.error)}</p>`;
    h += '</div><div class="card"><h2>Load</h2>';
    if (load.series) {
      const cpu = last(load.series.cpu), mem = last(load.series.memory);
      h += meter('CPU', cpu / 100, cpu == null ? 'none' : cpu.toFixed(0) + '%') + meter('Memory', mem / 100, mem == null ? 'none' : mem.toFixed(0) + '%');
      const p95 = last(load.series.responseP95);
      h += `<p class="note">Response time, 95th percentile:  ${p95 == null ? 'no requests' : ms(Math.round(p95 * 1000))}</p>`;
      h += `<p class="note">Work area:  ${load.workArea ? bytes(load.workArea.bytes) : 'unknown'}</p>`;
    } else h += `<p class="note">${esc(load.error)}</p>`;
    h += '</div></div>';

    const rows = [['ClientLimit', 'Requests in progress, one client, per task', L.ClientLimit, '', 'service'], ['AsyncClientLimit', 'Async jobs running, one client', L.AsyncClientLimit, '', 'service'],

       ...(L.FireflyLimit != null ? [['FireflyLimit', 'Requests in progress, all of Firefly\'s users together, per task', L.FireflyLimit, '', 'service'], ['FireflyAsyncLimit', 'Async jobs running, all of Firefly\'s users together', L.FireflyAsyncLimit, '', 'service']] : []),
       ['QueryMemory', 'Memory, one query', L.QueryMemory, '', 'service'],
       ['QueryTimeout', 'Time, one query', L.QueryTimeout, ' s', 'service'], ['MaxRecLimit', 'Rows, one result', L.MaxRecLimit, '', 'service'],
       ...(L.DownloadLimit != null ? [['DownloadLimit', 'Volume sent to one client in a day', L.DownloadLimit, '', 'service'], ['FireflyDownloadLimit', 'Volume sent to all of Firefly\'s users together in a day', L.FireflyDownloadLimit, '', 'service']] : []),
       ...(L.TotalDownloadLimit != null ? [['TotalDownloadLimit', 'Volume sent to all clients together in a day', L.TotalDownloadLimit, '', 'service'], ['ResultSize', 'Size, one result', L.ResultSize, '', 'service']] : []),
       ...(F && F.limit ? [['RateLimit', 'Requests in five minutes, one address (firewall)', F.limit, '', 'firewall'], ['Mode', 'Over that, the firewall', F.mode, '', 'firewall'],
                           ...(F.managed ? [['ManagedRules', 'On a match with one of AWS\'s rule sets, the firewall', F.managed, '', 'firewall']] : []),

      d.tables.map((t) => {

    if (mine === turn) main.innerHTML = `<div class="notice err">This view could not be read:  ${esc(e.message)}</div>`;
  }
}
nav(); signIn().then(show).catch((e) => { $('#main').innerHTML = `<div class="notice err">The panel could not start:  ${esc(e.message)}</div>`; });
setInterval(() => { if (document.visibilityState === 'visible' && tab === 'Status') show(true); }, 120000);
</script>
