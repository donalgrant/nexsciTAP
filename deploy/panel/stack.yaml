AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Archive in a Box - the administrator's control panel (views and controls).
  A static page and one Lambda function behind CloudFront, beside the service's
  stack and independent of it:  deleting this stack leaves the service as it is.

# Deploy with deploy/panel/deploy.sh, which packages the function's code.
#
# Nothing here runs unless the page asks or the canary's timer fires, so the
# stack costs close to nothing and is still there when the service has no task.

Parameters:
  ServiceStack:
    Type: String
    Default: aiab-fargate
    Description: Name of the service's stack (deploy/fargate), which is also its ECS cluster and service.
  ServiceUrl:
    Type: String
    Description: The service's public address, e.g. https://dxxxxxxxx.cloudfront.net
  PanelSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      The same value as the service stack's PanelSecret.  The functions send it to get
      through the service's access check.  Empty:  the canary and the table details wait.
  AdminCidr:
    Type: String
    AllowedPattern: '^\d+\.\d+\.\d+\.\d+/\d+(,\d+\.\d+\.\d+\.\d+/\d+)*$'
    Description: >-
      The IPv4 ranges admitted to the panel, separated by commas, e.g.
      203.0.113.7/32 or 134.4.0.0/16,131.215.0.0/16.  This is the outer door;
      sign-in is the inner one.
  SignIn:
    Type: String
    AllowedValues: [required, 'off']
    Default: required
    Description: Whether the panel's views and controls need a signed-in user.
  CallbackUrl:
    Type: String
    Default: ''
    Description: >-
      The panel's own address, https://dxxxx.cloudfront.net/, where sign-in returns to.
      It is an output of this stack, so it is known from the second deployment on;
      deploy.sh fills it in.
  DomainName:
    Type: String
    Default: ''
    Description: >-
      The panel's own name, e.g. aiab-admin.ipac.caltech.edu.  Empty to use the
      Amazon name CloudFront gives.  The name's DNS entry must be a CNAME
      to the distribution's cloudfront.net name.
  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      A certificate for DomainName from AWS Certificate Manager, issued in
      us-east-1 (the only region CloudFront reads).  Needed with DomainName.
  AlertEmail:
    Type: String
    Default: ''
    Description: Where alerts are sent.  Empty for none.  AWS asks the address to confirm before it sends any.
  SessionHours:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 24
    Description: Hours a sign-in lasts.
  CatalogBucket:
    Type: String
  CatalogPrefix:
    Type: String
    Default: catalogs
  ImagePrefix:
    Type: String
    Default: aiab
  BuildProject:
    Type: String
    Default: aiab-fargate-build
  TaskCap:
    Type: Number
    Default: 3
  CanaryMinutes:
    Type: Number
    Default: 5
    Description: Minutes between canary runs.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Network the one-off conversion task runs in (the service's).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the conversion task; it needs to reach S3 and ECR.
  IngestCpu:
    Type: String
    Default: '2048'
  IngestMemory:
    Type: String
    Default: '16384'
    Description: Memory of the conversion task in MiB.  Sorting a catalog is what needs it.
  IngestStorage:
    Type: Number
    Default: 100
    Description: Disk of the conversion task in GiB (21 to 200); it holds the input and the output at once.

Conditions:
  HaveAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HaveCallback: !Not [!Equals [!Ref CallbackUrl, '']]
  HaveDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:

  # The page under site/, the functions' own state under state/.  Private.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      # The page sends an upload straight to upload/ with a link the functions
      # sign for it, good for an hour.  The link is what admits the request,
      # so any origin may use one.
      CorsConfiguration:
        CorsRules:
          - {AllowedMethods: [PUT], AllowedOrigins: ['*'], AllowedHeaders: ['*'], MaxAge: 3000}
      LifecycleConfiguration:
        Rules:
          - {Id: uploads-are-temporary, Status: Enabled, Prefix: upload/, ExpirationInDays: 7,
             AbortIncompleteMultipartUpload: {DaysAfterInitiation: 2}}

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Sid: PageThroughCloudFrontOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/site/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---- watching (stage 4) --------------------------------------------------

  # CloudFront's own logs, of this panel and (by the service stack's
  # AccessLogBucket setting) of the service.  They are the only record of
  # requests turned away at the door, which never reach the service.
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerPreferred}]     # CloudFront delivers its logs by an ACL grant
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: logs-are-kept-30-days, Status: Enabled, ExpirationInDays: 30}

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Archive in a Box

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HaveAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertTopic

  # The rules are checked by the function itself, so something else has to
  # notice if the function stops: it reports each run, and silence is the alarm.
  WatcherSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The control panel's timer has not run for 20 minutes, so nothing is watching the service.
      Namespace: ArchiveInABox/Panel
      MetricName: Tick
      Dimensions: [{Name: Service, Value: !Ref ServiceStack}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 4
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # The same code as the panel's function, entered by another door that
  # hands out a digest and takes in a report, and does nothing else.
  WatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Archive in a Box control panel - digest for the daily review, and its report
      Runtime: python3.12
      Handler: panel.watch_handler
      Code: functions/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 120
      MemorySize: 512
      # The same settings as the panel's function, since it is the same code.
      Environment:
        Variables:
          SERVICE_STACK: !Ref ServiceStack
          SERVICE_URL: !Ref ServiceUrl
          PANEL_SECRET: !Ref PanelSecret
          CATALOG_BUCKET: !Ref CatalogBucket
          CATALOG_PREFIX: !Ref CatalogPrefix
          STATE_BUCKET: !Ref Bucket
          ECR_PREFIX: !Ref ImagePrefix
          BUILD_PROJECT: !Ref BuildProject
          TASK_CAP: !Ref TaskCap
          INGEST_CLUSTER: !Ref IngestCluster
          INGEST_TASKDEF: !Sub ${AWS::StackName}-ingest
          INGEST_SUBNETS: !Join [',', !Ref SubnetIds]
          INGEST_SG: !Ref IngestSecurityGroup
          INGEST_LOGS: !Ref IngestLogs
          SIGN_IN: !Ref SignIn
          SIGN_IN_HOST: !Sub ${UsersDomain}.auth.${AWS::Region}.amazoncognito.com
          SIGN_IN_CLIENT: !Ref UsersClient
          SIGN_IN_RETURN: !If [HaveDomain, !Sub 'https://${DomainName}/', !Ref CallbackUrl]
          ALERT_TOPIC: !Ref AlertTopic
          LOG_BUCKET: !Ref LogBucket

  WatchFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WatchFunction}
      RetentionInDays: 30

  # For whoever reviews the logs each day.  Anyone in this account who may
  # assume roles can take it; all it allows is calling the function above.
  WatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-watch
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: digest-and-report-only
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt WatchFunction.Arn}

  # ---- who may sign in -----------------------------------------------------
  # Accounts are made by an administrator only (aws cognito-idp
  # admin-create-user); nobody can sign themselves up.  Every account needs a
  # password and a code from an authenticator app.

  Users:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref AWS::StackName
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Archive in a Box control panel - your account
          EmailMessage: >-
            An account for the Archive in a Box control panel has been made for {username}.
            Your temporary password is {####}  It is good for seven days.  At your first
            sign-in you choose your own password and add the panel to an authenticator app.
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}

  UsersDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Users
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}

  UsersClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Users
      ClientName: panel-page
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      # The last scope is what lets the functions ask Cognito whose token they hold.
      AllowedOAuthScopes: [openid, email, aws.cognito.signin.user.admin]
      CallbackURLs:
        - !If [HaveDomain, !Sub 'https://${DomainName}/', !If [HaveCallback, !Ref CallbackUrl, 'https://example.invalid/']]
      LogoutURLs:
        - !If [HaveDomain, !Sub 'https://${DomainName}/', !If [HaveCallback, !Ref CallbackUrl, 'https://example.invalid/']]
      # The admin flow is for a test from the command line by someone who holds the account.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: !Ref SessionHours
      IdTokenValidity: !Ref SessionHours
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}

  # ---- the functions ------------------------------------------------------

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-the-service
          PolicyDocument:
            Statement:
              # Reads.  Nothing in this policy can change the service.
              - Effect: Allow
                Action: ecs:DescribeServices
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ServiceStack}/*
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - cloudwatch:GetMetricData
                  - elasticfilesystem:DescribeFileSystems
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - budgets:ViewBudget
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: {cloudwatch:namespace: ArchiveInABox/Panel}
              - Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:ListStackResources]
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceStack}/*
              - Sid: FirewallSettings        # the rate limit's stack; CloudFront's web ACLs are in us-east-1
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/aiab-waf*/*
              - Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ServiceStack}:*
              - Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImagePrefix}-*
              - Effect: Allow
                Action: [codebuild:ListBuildsForProject, codebuild:BatchGetBuilds]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${BuildProject}
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CatalogBucket}
                Condition:
                  StringLike: {s3:prefix: !Sub '${CatalogPrefix}/*'}
        - PolicyName: controls
          PolicyDocument:
            Statement:
              # Stage 2.  The whole of what the panel can change in the service.
              - Sid: TaskCountAndRestart
                Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ServiceStack}/${ServiceStack}
              - Sid: PausedPage
                Effect: Allow
                Action: elasticloadbalancing:ModifyRule
                Resource: !Sub arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/*
                Condition:
                  StringEquals: {'aws:ResourceTag/aws:cloudformation:stack-name': !Ref ServiceStack}
              - Effect: Allow
                Action: [elasticloadbalancing:DescribeRules, elasticloadbalancing:DescribeTargetHealth]
                Resource: '*'
              - Sid: Rebuild
                Effect: Allow
                Action: codebuild:StartBuild
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${BuildProject}
              - Sid: RollBackTheLiveTag
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:PutImage]
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImagePrefix}-tap
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImagePrefix}-proxy
        - PolicyName: datasets
          PolicyDocument:
            Statement:
              # Stage 3.  Tables move between areas of the catalog bucket; a
              # served table is only ever moved, to hidden/ or versions/.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CatalogBucket}
                Condition:
                  StringLike: {s3:prefix: [staging/*, hidden/*, versions/*]}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::${CatalogBucket}/${CatalogPrefix}/*
                  - !Sub arn:aws:s3:::${CatalogBucket}/staging/*
                  - !Sub arn:aws:s3:::${CatalogBucket}/hidden/*
                  - !Sub arn:aws:s3:::${CatalogBucket}/versions/*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${Bucket.Arn}/upload/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike: {s3:prefix: upload/*}
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AWS::StackName}-ingest:*
              - Effect: Allow
                Action: [ecs:DescribeTasks, ecs:TagResource]
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/${AWS::StackName}-ingest/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt IngestExecutionRole.Arn, !GetAtt IngestTaskRole.Arn]
                Condition:
                  StringEquals: {iam:PassedToService: ecs-tasks.amazonaws.com}
              - Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AWS::StackName}-ingest:*
              # A long move is run as a second invocation of this function.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-Function-*
        - PolicyName: watching
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: sns:Publish, Resource: !Ref AlertTopic}
              - {Effect: Allow, Action: s3:ListBucket, Resource: !GetAtt LogBucket.Arn}
              - {Effect: Allow, Action: s3:GetObject, Resource: !Sub '${LogBucket.Arn}/*'}
        - PolicyName: own-state
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${Bucket.Arn}/state/*

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Description: Archive in a Box control panel - views and canary
      Runtime: python3.12
      Handler: panel.handler
      Code: functions/
      Role: !GetAtt FunctionRole.Arn
      Timeout: 900                # views answer in seconds; moving a large table takes minutes
      MemorySize: 512
      Environment:
        Variables:
          SERVICE_STACK: !Ref ServiceStack
          SERVICE_URL: !Ref ServiceUrl
          PANEL_SECRET: !Ref PanelSecret
          CATALOG_BUCKET: !Ref CatalogBucket
          CATALOG_PREFIX: !Ref CatalogPrefix
          STATE_BUCKET: !Ref Bucket
          ECR_PREFIX: !Ref ImagePrefix
          BUILD_PROJECT: !Ref BuildProject
          TASK_CAP: !Ref TaskCap
          INGEST_CLUSTER: !Ref IngestCluster
          INGEST_TASKDEF: !Sub ${AWS::StackName}-ingest
          INGEST_SUBNETS: !Join [',', !Ref SubnetIds]
          INGEST_SG: !Ref IngestSecurityGroup
          INGEST_LOGS: !Ref IngestLogs
          SIGN_IN: !Ref SignIn
          SIGN_IN_HOST: !Sub ${UsersDomain}.auth.${AWS::Region}.amazoncognito.com
          SIGN_IN_CLIENT: !Ref UsersClient
          SIGN_IN_RETURN: !If [HaveDomain, !Sub 'https://${DomainName}/', !Ref CallbackUrl]
          ALERT_TOPIC: !Ref AlertTopic
          LOG_BUCKET: !Ref LogBucket

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 30

  # Only CloudFront may call it:  requests must be signed by this distribution.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---- the one-off conversion task ----------------------------------------
  # Started for an ingest and gone when it ends.  It runs the service's own
  # image, which holds the conversion tools, with a different entry point.

  IngestCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}-ingest

  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}-ingest
      RetentionInDays: 30

  IngestExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the conversion may touch: it reads an upload or a served catalog,
  # and writes only to staging.
  IngestTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: ingest
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub ${Bucket.Arn}/upload/*
                  - !Sub arn:aws:s3:::${CatalogBucket}/${CatalogPrefix}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CatalogBucket}
                Condition:
                  StringLike: {s3:prefix: [!Sub '${CatalogPrefix}/*', staging/*]}
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike: {s3:prefix: upload/*}
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::${CatalogBucket}/staging/*
              # The report of a full test of a served table (MODE=check), which stores nothing else.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${Bucket.Arn}/state/fulltest/*

  IngestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box control panel - conversion task; nothing may connect to it
      VpcId: !Ref VpcId

  IngestTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-ingest
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref IngestCpu
      Memory: !Ref IngestMemory
      EphemeralStorage: {SizeInGiB: !Ref IngestStorage}
      ExecutionRoleArn: !GetAtt IngestExecutionRole.Arn
      TaskRoleArn: !GetAtt IngestTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: ingest
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ImagePrefix}-tap:live
          Essential: true
          EntryPoint: [python, /opt/nexsciTAP/tools/ingest_task.py]
          Environment:
            - {Name: TASK_MEMORY_MB, Value: !Ref IngestMemory}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref IngestLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ingest

  # ---- the canary's timer -------------------------------------------------

  CanaryRule:
    Type: AWS::Events::Rule
    DependsOn: FunctionLogs
    Properties:
      Description: Archive in a Box control panel - canary, standby schedule, return from standby
      ScheduleExpression: !Sub rate(${CanaryMinutes} minutes)
      Targets:
        - {Id: canary, Arn: !GetAtt Function.Arn, Input: '{"canary": true}'}

  CanaryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt Function.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CanaryRule.Arn

  # ---- the door -----------------------------------------------------------

  AccessFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-access
      AutoPublish: true
      FunctionConfig:
        Comment: Admit the allowed address ranges only
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function toInt(ip) {
            var p = ip.split('.');
            if (p.length !== 4) { return null; }
            return ((+p[0] << 24) | (+p[1] << 16) | (+p[2] << 8) | +p[3]) >>> 0;
        }
        function handler(event) {
            var allowed = '${AdminCidr}'.split(',');
            var ip = toInt(event.viewer.ip);
            if (ip !== null) {
                for (var i = 0; i < allowed.length; i++) {
                    var parts = allowed[i].split('/');
                    var bits = +parts[1];
                    var mask = bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0;
                    if (((ip & mask) >>> 0) === ((toInt(parts[0]) & mask) >>> 0)) {
                        return event.request;
                    }
                }
            }
            return { statusCode: 403, statusDescription: 'Forbidden' };
        }

  PageAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-page
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FunctionAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-functions
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} - Archive in a Box control panel
        HttpVersion: http2
        IPV6Enabled: false          # the access check understands IPv4 only
        PriceClass: PriceClass_100
        Aliases: !If [HaveDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HaveDomain
          - {AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        Logging: {Bucket: !GetAtt LogBucket.DomainName, Prefix: panel/, IncludeCookies: false}
        Origins:
          - Id: page
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /site
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !Ref PageAccess
          - Id: functions
            DomainName: !Select [2, !Split ['/', !GetAtt FunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginReadTimeout: 60
            OriginAccessControlId: !Ref FunctionAccess
        DefaultCacheBehavior:
          TargetOriginId: page
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad            # managed: CachingDisabled
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt AccessFunction.FunctionMetadata.FunctionARN}
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: functions
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # managed: CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # managed: AllViewerExceptHostHeader
            FunctionAssociations:
              - {EventType: viewer-request, FunctionARN: !GetAtt AccessFunction.FunctionMetadata.FunctionARN}

Outputs:
  LogBucket:
    Value: !Ref LogBucket
  WatchFunction:
    Value: !Ref WatchFunction
  WatchRole:
    Value: !GetAtt WatchRole.Arn
  UserPool:
    Value: !Ref Users
  UserPoolClient:
    Value: !Ref UsersClient
  PanelUrl:
    Value: !If [HaveDomain, !Sub 'https://${DomainName}/', !Sub 'https://${Distribution.DomainName}/']
  CloudFrontName:
    Description: What the DNS entry for DomainName points to (a CNAME).
    Value: !GetAtt Distribution.DomainName
  Bucket:
    Value: !Ref Bucket
  Function:
    Value: !Ref Function
