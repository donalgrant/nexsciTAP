AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Archive in a Box - a rate limit in front of the service.  A web ACL for the
  service's CloudFront distribution.  CloudFront reads web ACLs from us-east-1
  only, so this is a stack of its own, created there; its WebAclArn output is
  given to the service's stack as the WebAclArn setting.

Parameters:
  RateLimit:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: >-
      Requests one address may make in five minutes.  On 19 to 21 November
      2026 the busiest address made 144, during testing.
  OverallLimit:
    Type: Number
    Default: 5000
    MinValue: 10
    Description: >-
      Requests from all addresses together in five minutes, above which the
      Overall rule counts.  It only counts: it is there to be seen, and to be
      made a limit if access is widened.  The busiest five minutes of the
      same three days had 156.
  Mode:
    Type: String
    Default: count
    AllowedValues: [count, block]
    Description: >-
      count: an address over RateLimit is only counted (the PerAddress
      metric).  block: its requests are refused with status 429 until its
      rate falls.
  ManagedRules:
    Type: String
    Default: count
    AllowedValues: [count, block]
    Description: >-
      AWS's own rule sets (addresses with a bad reputation, inputs known to
      be attacks, and the common web exploits).  count: a match is only
      counted.  block: it is refused with status 403, except for the rules
      of the common set listed in the template, which ordinary use of this
      service matches and which stay counted.  The set against SQL injection
      is left out on purpose: every query to this service is SQL.

Conditions:
  Blocking: !Equals [!Ref Mode, block]
  ManagedBlocking: !Equals [!Ref ManagedRules, block]

Resources:
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}
      Scope: CLOUDFRONT
      Description: Rate limit for the Archive in a Box service
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}
      CustomResponseBodies:
        slow-down:
          ContentType: TEXT_PLAIN
          Content: >-
            Too many requests from this address in the last five minutes.
            Wait a few minutes and try again.  For a large job, use one
            asynchronous query in place of many small ones.
      Rules:
        - Name: PerAddress
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          Action: !If
            - Blocking
            - Block:
                CustomResponse:
                  ResponseCode: 429
                  CustomResponseBodyKey: slow-down
            - Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-PerAddress
        - Name: Overall
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: !Ref OverallLimit
              EvaluationWindowSec: 300
              AggregateKeyType: CONSTANT
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /
                  TextTransformations: [{Priority: 0, Type: NONE}]
          Action: {Count: {}}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-Overall
        # AWS's managed rule sets, after the rate rules so that a flood is
        # answered 429 before anything else is looked at.
        - Name: BadReputation
          Priority: 10
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-BadReputation
        - Name: KnownBadInputs
          Priority: 11
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-KnownBadInputs
        - Name: Common
          Priority: 12
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Rules that ordinary use of the service matches; they count
              # and never refuse.  An uploaded table is far over the body
              # size this set allows.
              RuleActionOverrides:
                - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-Common

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
