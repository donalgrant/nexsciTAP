AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Archive in a Box - a rate limit in front of the service.  A web ACL for the
  service's CloudFront distribution.  CloudFront reads web ACLs from us-east-1
  only, so this is a stack of its own, created there; its WebAclArn output is
  given to the service's stack as the WebAclArn setting.

Parameters:
  RateLimit:
    Type: Number
    Default: 1000
    MinValue: 10
    Description: >-
      Requests one address may make in five minutes.  On 19 to 21 November
      2026 the busiest address made 144, during testing.
  OverallLimit:
    Type: Number
    Default: 5000
    MinValue: 10
    Description: >-
      Requests from all addresses together in five minutes, above which the
      Overall rule counts.  It only counts: it is there to be seen, and to be
      made a limit if access is widened.  The busiest five minutes of the
      same three days had 156.
  Mode:
    Type: String
    Default: block
    AllowedValues: [count, block]
    Description: >-
      count: an address over RateLimit is only counted (the PerAddress
      metric).  block: its requests are refused with status 429 until its
      rate falls.
  ManagedRules:
    Type: String
    Default: block
    AllowedValues: [count, block]
    Description: >-
      AWS's own rule sets (addresses with a bad reputation, inputs known to
      be attacks, and the common web exploits).  count: a match is only
      counted.  block: it is refused with status 403, except for the rules
      of the common set listed in the template, which ordinary use of this
      service matches and which stay counted.  The set against SQL injection
      is left out on purpose: every query to this service is SQL.

  BlockedAddresses:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9./]+(,[0-9./]+)*$'
    Description: >-
      Addresses refused outright, whatever their rate: IPv4 addresses or
      ranges in CIDR form (192.0.2.7/32), separated by commas.  Empty for
      none.  The control panel's Load tab changes this.

Conditions:
  Blocking: !Equals [!Ref Mode, block]
  AnyBlocked: !Not [!Equals [!Ref BlockedAddresses, '']]
  ManagedBlocking: !Equals [!Ref ManagedRules, block]

Resources:
  # Addresses the administrator has blocked.  The set exists when empty, so
  # that blocking the first one changes a set and creates nothing.
  Blocked:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: !Sub ${AWS::StackName}-blocked
      Scope: CLOUDFRONT
      Description: Addresses refused by the Archive in a Box service
      IPAddressVersion: IPV4
      Addresses: !If [AnyBlocked, !Split [',', !Ref BlockedAddresses], []]

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}
      Scope: CLOUDFRONT
      Description: Rate limit for the Archive in a Box service
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}
      CustomResponseBodies:
        # The refusals are written as DALI error documents (a VOTable whose
        # QUERY_STATUS is ERROR), as the service writes its own, so that a
        # TAP client shows the message and not only the status.  A person
        # with curl can still read it.
        slow-down:
          ContentType: TEXT_PLAIN
          Content: |
            <?xml version="1.0" encoding="UTF-8"?>
            <VOTABLE version="1.3" xmlns="http://www.ivoa.net/xml/VOTable/v1.3">
            <RESOURCE type="results">
            <INFO name="QUERY_STATUS" value="ERROR">
            Too many requests from this address in the last five minutes.  Wait a few minutes and try again.  For a large job, use one asynchronous query in place of many small ones.
            </INFO>
            </RESOURCE>
            </VOTABLE>
        blocked:
          ContentType: TEXT_PLAIN
          Content: |
            <?xml version="1.0" encoding="UTF-8"?>
            <VOTABLE version="1.3" xmlns="http://www.ivoa.net/xml/VOTable/v1.3">
            <RESOURCE type="results">
            <INFO name="QUERY_STATUS" value="ERROR">
            This service is not accepting requests from this address.  If you think that is a mistake, write to the service's administrator.
            </INFO>
            </RESOURCE>
            </VOTABLE>
      Rules:
        - Name: Blocked
          Priority: 0
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt Blocked.Arn
          Action:
            Block:
              CustomResponse:
                ResponseCode: 403
                CustomResponseBodyKey: blocked
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-Blocked
        - Name: PerAddress
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimit
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          Action: !If
            - Blocking
            - Block:
                CustomResponse:
                  ResponseCode: 429
                  CustomResponseBodyKey: slow-down
                  ResponseHeaders:
                    - {Name: Retry-After, Value: '300'}
            - Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-PerAddress
        - Name: Overall
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: !Ref OverallLimit
              EvaluationWindowSec: 300
              AggregateKeyType: CONSTANT
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /
                  TextTransformations: [{Priority: 0, Type: NONE}]
          Action: {Count: {}}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-Overall
        # AWS's managed rule sets, after the rate rules so that a flood is
        # answered 429 before anything else is looked at.
        - Name: BadReputation
          Priority: 10
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-BadReputation
        - Name: KnownBadInputs
          Priority: 11
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-KnownBadInputs
        - Name: Common
          Priority: 12
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Rules that ordinary use of this service matches, or may:
              # they count and never refuse.  Seen on 20 November 2026 with
              # the set only counting: an uploaded table is over the body
              # size allowed and its XML reads as script (SizeRestrictions,
              # CrossSiteScripting); Firefly's requests name the service as
              # http://localhost/TAP (EC2MetaDataSSRF); and a client's job
              # polling sent no User-Agent.  The other rules here look at
              # the same places, the body and the query arguments, where a
              # query or a URL is ordinary: a long query in a GET, a URL as
              # an argument, comparisons written with < and >.
              RuleActionOverrides:
                - {Name: NoUserAgent_HEADER, ActionToUse: {Count: {}}}
                - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
                - {Name: SizeRestrictions_QUERYSTRING, ActionToUse: {Count: {}}}
                - {Name: EC2MetaDataSSRF_BODY, ActionToUse: {Count: {}}}
                - {Name: EC2MetaDataSSRF_QUERYARGUMENTS, ActionToUse: {Count: {}}}
                - {Name: GenericRFI_BODY, ActionToUse: {Count: {}}}
                - {Name: GenericRFI_QUERYARGUMENTS, ActionToUse: {Count: {}}}
                - {Name: GenericLFI_BODY, ActionToUse: {Count: {}}}
                - {Name: CrossSiteScripting_BODY, ActionToUse: {Count: {}}}
                - {Name: CrossSiteScripting_QUERYARGUMENTS, ActionToUse: {Count: {}}}
          OverrideAction: !If [ManagedBlocking, {None: {}}, {Count: {}}]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-Common

Outputs:
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
