AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Archive in a Box pilot on ECS Fargate.  One task holds three containers
  (TAP service, Firefly, nginx front door) behind an Application Load
  Balancer, with CloudFront in front to provide HTTPS on an Amazon name.  The catalogs are Parquet files in S3, read through the task role.
  There are no servers to manage; deleting this stack removes everything in it.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two public subnets in different zones.
  AllowedCidr1:
    Type: String
    AllowedPattern: '^\d+\.\d+\.\d+\.\d+/\d+$'
    Description: First IPv4 address range allowed to reach the service.
  AllowedCidr2:
    Type: String
    AllowedPattern: '^\d+\.\d+\.\d+\.\d+/\d+$'
    Description: Second IPv4 address range allowed to reach the service.
  CloudFrontPrefixListId:
    Type: String
    Description: >
      Id of the managed prefix list com.amazonaws.global.cloudfront.origin-facing
      in this region (aws ec2 describe-managed-prefix-lists).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: Random value CloudFront sends to the load balancer, which refuses requests without it.
  TapImage:
    Type: String
  ProxyImage:
    Type: String
  FireflyImage:
    Type: String
  CatalogBucket:
    Type: String
  CatalogPrefix:
    Type: String
    Default: catalogs/
  Tables:
    Type: String
    Default: ''
    Description: >
      Space-separated name=relative/glob pairs under the prefix.  Optional when
      DiscoverTables is true; use it to give a folder a different table name.
  DiscoverTables:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Serve every folder of Parquet files under the prefix, and keep looking for new ones.
  DiscoverInterval:
    Type: Number
    Default: 300
    Description: Seconds between looks for new or removed folders.
  HipsUrl:
    Type: String
    Default: https://irsa.ipac.caltech.edu/data/hips/CDS/DSS2/color
  FireflyAdminPassword:
    Type: String
    NoEcho: true
  QueryTimeout:
    Type: Number
    Default: 300
  MaxRecLimit:
    Type: Number
    Default: 2000000
  DesiredCount:
    Type: Number
    Default: 1
    Description: >
      Number of copies of the task.  0 stops the service (and its hourly cost)
      without deleting it; more than 1 share the work area and the load.
  ClientLimit:
    Type: Number
    Default: 6
    Description: Requests one client address may have in progress at once, per task (0 = no limit).
  AsyncLimit:
    Type: Number
    Default: 8
    Description: Async jobs running at once, over all tasks (0 = no limit).
  AsyncClientLimit:
    Type: Number
    Default: 3
    Description: Async jobs one client address may have running at once (0 = no limit).
  WorkRetentionDays:
    Type: Number
    Default: 7
    Description: Days a query's results and uploads are kept in the work area.
  ImagePrefix:
    Type: String
    Default: aiab
    Description: ECR repositories <prefix>-tap, <prefix>-proxy and <prefix>-firefly must exist.
  SourceRepo:
    Type: String
    Default: https://github.com/donalgrant/nexsciTAP.git
    Description: Public git repository the build project clones.
  SourceRef:
    Type: String
    Default: duckdb-backend
    Description: Branch, tag or commit built when a build names none.
  SpatialIndexRepo:
    Type: String
    Default: https://github.com/Caltech-IPAC/SpatialIndex.git
  SpatialIndexRef:
    Type: String
    Default: 6b073ae6d7dd0c30dd24eb51a9353c089ab350fd
  FireflySource:
    Type: String
    Default: ipac/firefly:2026.4.0
    Description: Public Firefly image the build copies into ECR.

Resources:

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  # Lets ECS pull the images and write the logs.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the containers themselves may do: read the catalogs, nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-catalogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CatalogBucket}
                Condition:
                  StringLike: {'s3:prefix': [!Sub '${CatalogPrefix}*']}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${CatalogBucket}/${CatalogPrefix}*
        - PolicyName: use-work-area
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [elasticfilesystem:ClientMount, elasticfilesystem:ClientWrite]
                Resource: !GetAtt WorkFileSystem.Arn
                Condition:
                  StringEquals: {'elasticfilesystem:AccessPointArn': !GetAtt WorkAccessPoint.Arn}

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box pilot - load balancer accepts only CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Who may use the service is decided at CloudFront (AccessFunction).
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixListId}

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box pilot - task accepts only the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  # ---- Work area -------------------------------------------------------
  # Async results and uploaded tables live on a network file system rather
  # than inside the task, so they outlast a restart and every copy of the
  # task sees the same jobs.  Old jobs are removed by the service itself
  # (WorkRetentionDays).

  WorkFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      FileSystemTags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-work'}

  WorkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box pilot - work area accepts only the task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  WorkMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkFileSystem
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroups: [!Ref WorkSecurityGroup]

  WorkMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkFileSystem
      SubnetId: !Select [1, !Ref SubnetIds]
      SecurityGroups: [!Ref WorkSecurityGroup]

  # Everything is done as the service's own user (www-data, 33), in one
  # directory of the file system.
  WorkAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref WorkFileSystem
      PosixUser: {Uid: '33', Gid: '33'}
      RootDirectory:
        Path: /work
        CreationInfo: {OwnerUid: '33', OwnerGid: '33', Permissions: '0755'}

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AWS::StackName
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        # Long synchronous queries and Firefly's WebSocket.
        - {Key: idle_timeout.timeout_seconds, Value: '900'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
        # With more than one task, a browser stays with the task holding
        # its Firefly session.  TAP needs no such thing: its state is in
        # the shared work area.
        - {Key: stickiness.enabled, Value: 'true'}
        - {Key: stickiness.type, Value: lb_cookie}
        - {Key: stickiness.lb_cookie.duration_seconds, Value: '86400'}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      # The prefix list admits every CloudFront distribution, anyone's.  Only
      # requests carrying this stack's secret header are passed on.
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden}

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-Origin-Secret, Values: [!Ref OriginSecret]}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  # ---- HTTPS front ----------------------------------------------------
  # CloudFront serves the site at https://<id>.cloudfront.net with Amazon's
  # certificate, so no domain has to be registered.  Nothing is cached.

  AccessFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-access
      AutoPublish: true
      FunctionConfig:
        Comment: Admit only the allowed IPv4 address ranges
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function toInt(ip) {
            var p = ip.split('.');
            if (p.length !== 4) { return null; }
            return ((+p[0] << 24) | (+p[1] << 16) | (+p[2] << 8) | +p[3]) >>> 0;
        }
        function inRange(ip, cidr) {
            var parts = cidr.split('/');
            var bits = +parts[1];
            var mask = bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0;
            return ((ip & mask) >>> 0) === ((toInt(parts[0]) & mask) >>> 0);
        }
        function handler(event) {
            var allowed = ['${AllowedCidr1}', '${AllowedCidr2}'];
            var ip = toInt(event.viewer.ip);
            if (ip !== null) {
                for (var i = 0; i < allowed.length; i++) {
                    if (inRange(ip, allowed[i])) {
                        // Tell the service who is asking, for its per-client
                        // limits.  Set here, so a client cannot choose it.
                        event.request.headers['x-viewer-ip'] = { value: event.viewer.ip };
                        return event.request;
                    }
                }
            }
            return { statusCode: 403, statusDescription: 'Forbidden' };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} - HTTPS front for the load balancer
        HttpVersion: http2
        IPV6Enabled: false          # the access check understands IPv4 only
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              # The longest CloudFront waits for the service to start
              # answering.  A synchronous query that runs longer is cut off;
              # async jobs are not affected.
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - {HeaderName: X-Origin-Secret, HeaderValue: !Ref OriginSecret}
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # managed: CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # managed: AllViewer
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt AccessFunction.FunctionMetadata.FunctionARN}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '8192'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        # Async results and uploads, on the shared file system.
        - Name: work
          EFSVolumeConfiguration:
            FilesystemId: !Ref WorkFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref WorkAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: tap
          Image: !Ref TapImage
          Essential: true
          Memory: 3584
          Environment:
            - {Name: PUBLIC_URL, Value: !Sub 'https://${Distribution.DomainName}'}
            # Firefly, beside it in the task, reaches it over plain HTTP.
            - {Name: HTTP_HOSTS, Value: 'http://localhost'}
            - {Name: TAP_PORT, Value: '8081'}
            - {Name: CATALOG_PREFIX, Value: !Sub 's3://${CatalogBucket}/${CatalogPrefix}'}
            - {Name: TABLES, Value: !Ref Tables}
            - {Name: DISCOVER, Value: !Ref DiscoverTables}
            - {Name: DISCOVER_INTERVAL, Value: !Ref DiscoverInterval}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: DUCKDB_MEMORY, Value: 2GB}
            - {Name: DUCKDB_THREADS, Value: '8'}
            - {Name: QUERY_TIMEOUT, Value: !Ref QueryTimeout}
            - {Name: MAXREC_LIMIT, Value: !Ref MaxRecLimit}
            - {Name: WORK_RETENTION_DAYS, Value: !Ref WorkRetentionDays}
            # Who a request is from is what CloudFront says (AccessFunction).
            # Firefly, in this task, sends no such header; all its users
            # come from one address, so only the overall limits apply to it.
            - {Name: CLIENT_HEADER, Value: X-Viewer-IP}
            - {Name: UNLIMITED_CLIENTS, Value: '127.0.0.1'}
            - {Name: CLIENT_LIMIT, Value: !Ref ClientLimit}
            - {Name: ASYNC_LIMIT, Value: !Ref AsyncLimit}
            - {Name: ASYNC_CLIENT_LIMIT, Value: !Ref AsyncClientLimit}
          MountPoints:
            - {SourceVolume: work, ContainerPath: /work}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task
        - Name: firefly
          Image: !Ref FireflyImage
          Essential: true
          Memory: 3584
          Environment:
            - {Name: ADMIN_PASSWORD, Value: !Ref FireflyAdminPassword}
            # Lists the TAP service in Firefly's own menu, by the name
            # Firefly's server can reach it under.
            - Name: PROPS_FIREFLY_OPTIONS
              Value: '{"tap":{"additional":{"services":[{"label":"Archive in a Box pilot","value":"http://localhost/TAP"}]}}}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task
        - Name: proxy
          Image: !Ref ProxyImage
          Essential: true
          Memory: 256
          PortMappings:
            - {ContainerPort: 80}
          Environment:
            - {Name: PUBLIC_HOST, Value: !GetAtt Distribution.DomainName}
            - {Name: PUBLIC_SCHEME, Value: https}
            - {Name: PROXY_COOKIE_FLAGS, Value: '# not needed over HTTPS'}
            - {Name: HIPS_URL, Value: !Ref HipsUrl}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ListenerRule, WorkMountTarget1, WorkMountTarget2]
    Properties:
      ServiceName: !Ref AWS::StackName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # Tasks carry the service's tags, so their cost can be reported by tag.
      PropagateTags: SERVICE
      # A restart starts the new task before stopping the old one, so the
      # service stays up; the two share the work area meanwhile.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          # A public address, so the task can pull images and read S3
          # without a NAT gateway; the security group admits only the
          # load balancer.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: proxy
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup

  # ---- Image build ----------------------------------------------------
  # Start a build with:
  #   aws codebuild start-build --project-name <stack>-build
  # optionally adding
  #   --environment-variables-override name=SOURCE_REF,value=<commit>
  # It builds the images from source, pushes them, and restarts the service.

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-and-roll
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-build*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImagePrefix}-*
              # May restart this one service; may not change what it is.
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Ref Service

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-build
      Description: Builds the Archive in a Box images from source and restarts the service on them.
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      TimeoutInMinutes: 30
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true   # needed to run Docker
        EnvironmentVariables:
          - {Name: SOURCE_REPO, Value: !Ref SourceRepo}
          - {Name: SOURCE_REF, Value: !Ref SourceRef}
          - {Name: SPATIAL_REPO, Value: !Ref SpatialIndexRepo}
          - {Name: SPATIAL_REF, Value: !Ref SpatialIndexRef}
          - {Name: FIREFLY_SOURCE, Value: !Ref FireflySource}
          - {Name: IMAGE_PREFIX, Value: !Ref ImagePrefix}
          - {Name: REGISTRY, Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'}
          - {Name: ECS_CLUSTER, Value: !Ref Cluster}
          - {Name: ECS_SERVICE, Value: !GetAtt Service.Name}
      Source:
        Type: NO_SOURCE
        # The steps themselves live in the repository being built.
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - git clone --quiet "$SOURCE_REPO" nexsciTAP
                - git -C nexsciTAP checkout --quiet "$SOURCE_REF"
                - bash nexsciTAP/deploy/fargate/build-images.sh

Outputs:
  BuildProject:
    Value: !Ref BuildProject
  FireflyUrl:
    Value: !Sub 'https://${Distribution.DomainName}/firefly/'
  TapUrl:
    Value: !Sub 'https://${Distribution.DomainName}/TAP'
  LogGroup:
    Value: !Ref LogGroup
