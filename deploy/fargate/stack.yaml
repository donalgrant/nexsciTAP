AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Archive in a Box pilot on ECS Fargate.  One task holds three containers
  (TAP service, Firefly, nginx front door) behind an Application Load
  Balancer.  The catalogs are Parquet files in S3, read through the task role.
  There are no servers to manage; deleting this stack removes everything in it.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different zones.
  AllowedCidr1:
    Type: String
    Description: First address range allowed to reach the service.
  AllowedCidr2:
    Type: String
    Description: Second address range allowed to reach the service.
  TapImage:
    Type: String
  ProxyImage:
    Type: String
  FireflyImage:
    Type: String
  CatalogBucket:
    Type: String
  CatalogPrefix:
    Type: String
    Default: catalogs/
  Tables:
    Type: String
    Default: ''
    Description: >
      Space-separated name=relative/glob pairs under the prefix.  Optional when
      DiscoverTables is true; use it to give a folder a different table name.
  DiscoverTables:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Serve every folder of Parquet files under the prefix, and keep looking for new ones.
  DiscoverInterval:
    Type: Number
    Default: 300
    Description: Seconds between looks for new or removed folders.
  HipsUrl:
    Type: String
    Default: https://irsa.ipac.caltech.edu/data/hips/CDS/DSS2/color
  FireflyAdminPassword:
    Type: String
    NoEcho: true
  QueryTimeout:
    Type: Number
    Default: 300
  MaxRecLimit:
    Type: Number
    Default: 2000000
  DesiredCount:
    Type: Number
    Default: 1
    Description: 0 stops the service (and its hourly cost) without deleting it.
  ImagePrefix:
    Type: String
    Default: aiab
    Description: ECR repositories <prefix>-tap, <prefix>-proxy and <prefix>-firefly must exist.
  SourceRepo:
    Type: String
    Default: https://github.com/donalgrant/nexsciTAP.git
    Description: Public git repository the build project clones.
  SourceRef:
    Type: String
    Default: duckdb-backend
    Description: Branch, tag or commit built when a build names none.
  SpatialIndexRepo:
    Type: String
    Default: https://github.com/Caltech-IPAC/SpatialIndex.git
  SpatialIndexRef:
    Type: String
    Default: 6b073ae6d7dd0c30dd24eb51a9353c089ab350fd
  FireflySource:
    Type: String
    Default: ipac/firefly:2026.4.0
    Description: Public Firefly image the build copies into ECR.

Resources:

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  # Lets ECS pull the images and write the logs.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # What the containers themselves may do: read the catalogs, nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-catalogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${CatalogBucket}
                Condition:
                  StringLike: {'s3:prefix': [!Sub '${CatalogPrefix}*']}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${CatalogBucket}/${CatalogPrefix}*

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box pilot - who may reach the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr1}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr2}

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archive in a Box pilot - task accepts only the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AWS::StackName
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        # Long synchronous queries and Firefly's WebSocket.
        - {Key: idle_timeout.timeout_seconds, Value: '900'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '8192'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        # Async results and uploads.  Lives as long as the task; more than
        # one task would need shared storage (EFS) here instead.
        - Name: work
      ContainerDefinitions:
        - Name: tap
          Image: !Ref TapImage
          Essential: true
          Memory: 3584
          Environment:
            - {Name: PUBLIC_URL, Value: !Sub 'http://${LoadBalancer.DNSName}'}
            - {Name: HTTP_HOSTS, Value: localhost}
            - {Name: TAP_PORT, Value: '8081'}
            - {Name: CATALOG_PREFIX, Value: !Sub 's3://${CatalogBucket}/${CatalogPrefix}'}
            - {Name: TABLES, Value: !Ref Tables}
            - {Name: DISCOVER, Value: !Ref DiscoverTables}
            - {Name: DISCOVER_INTERVAL, Value: !Ref DiscoverInterval}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: DUCKDB_MEMORY, Value: 2GB}
            - {Name: DUCKDB_THREADS, Value: '8'}
            - {Name: QUERY_TIMEOUT, Value: !Ref QueryTimeout}
            - {Name: MAXREC_LIMIT, Value: !Ref MaxRecLimit}
          MountPoints:
            - {SourceVolume: work, ContainerPath: /work}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task
        - Name: firefly
          Image: !Ref FireflyImage
          Essential: true
          Memory: 3584
          Environment:
            - {Name: ADMIN_PASSWORD, Value: !Ref FireflyAdminPassword}
            # Lists the TAP service in Firefly's own menu, by the name
            # Firefly's server can reach it under.
            - Name: PROPS_FIREFLY_OPTIONS
              Value: '{"tap":{"additional":{"services":[{"label":"Archive in a Box pilot","value":"http://localhost/TAP"}]}}}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task
        - Name: proxy
          Image: !Ref ProxyImage
          Essential: true
          Memory: 256
          PortMappings:
            - {ContainerPort: 80}
          Environment:
            - {Name: PUBLIC_HOST, Value: !GetAtt LoadBalancer.DNSName}
            - {Name: HIPS_URL, Value: !Ref HipsUrl}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Ref AWS::StackName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # One task at a time: the work area is not shared.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      HealthCheckGracePeriodSeconds: 300
      NetworkConfiguration:
        AwsvpcConfiguration:
          # A public address, so the task can pull images and read S3
          # without a NAT gateway; the security group admits only the
          # load balancer.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: proxy
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup

  # ---- Image build ----------------------------------------------------
  # Start a build with:
  #   aws codebuild start-build --project-name <stack>-build
  # optionally adding
  #   --environment-variables-override name=SOURCE_REF,value=<commit>
  # It builds the images from source, pushes them, and restarts the service.

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-and-roll
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-build*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImagePrefix}-*
              # May restart this one service; may not change what it is.
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Ref Service

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-build
      Description: Builds the Archive in a Box images from source and restarts the service on them.
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      TimeoutInMinutes: 30
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true   # needed to run Docker
        EnvironmentVariables:
          - {Name: SOURCE_REPO, Value: !Ref SourceRepo}
          - {Name: SOURCE_REF, Value: !Ref SourceRef}
          - {Name: SPATIAL_REPO, Value: !Ref SpatialIndexRepo}
          - {Name: SPATIAL_REF, Value: !Ref SpatialIndexRef}
          - {Name: FIREFLY_SOURCE, Value: !Ref FireflySource}
          - {Name: IMAGE_PREFIX, Value: !Ref ImagePrefix}
          - {Name: REGISTRY, Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com'}
          - {Name: ECS_CLUSTER, Value: !Ref Cluster}
          - {Name: ECS_SERVICE, Value: !GetAtt Service.Name}
      Source:
        Type: NO_SOURCE
        # The steps themselves live in the repository being built.
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - git clone --quiet "$SOURCE_REPO" nexsciTAP
                - git -C nexsciTAP checkout --quiet "$SOURCE_REF"
                - bash nexsciTAP/deploy/fargate/build-images.sh

Outputs:
  BuildProject:
    Value: !Ref BuildProject
  FireflyUrl:
    Value: !Sub 'http://${LoadBalancer.DNSName}/firefly/'
  TapUrl:
    Value: !Sub 'http://${LoadBalancer.DNSName}/TAP'
  LogGroup:
    Value: !Ref LogGroup
