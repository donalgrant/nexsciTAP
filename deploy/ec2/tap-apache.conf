ServerName tap

<VirtualHost *:80>
    # Long sync queries and large uploads.
    Timeout 900
    LimitRequestBody 629145600

    SetEnv TAP_CONF   /opt/tap/TAP.conf
    SetEnv PYTHONPATH /opt/nexsciTAP
    SetEnv HOME       /var/lib/tap

    # The service writes its own HTTP status line; Apache passes output
    # through untouched for scripts whose names start with "nph-".
    ScriptAlias /TAP /opt/tap/cgi-bin/nph-tap.py

    <Directory /opt/tap/cgi-bin>
        Options +ExecCGI
        Require all granted
    </Directory>

    # Results of async jobs.
    Alias /workspace /work

    <Directory /work>
        Options -Indexes
        Require all granted

        # Tables that users uploaded stay private to the job.
        <FilesMatch "^upload_.*\.vot$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
