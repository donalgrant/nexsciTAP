# One front door on port 80:  /firefly -> Firefly,  /TAP and /workspace -> TAP.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# EC2 public hostnames are longer than nginx's default allows.
server_names_hash_bucket_size 128;

# Anything that arrives under another name (the bare IP address, say) is sent
# to the one public hostname.  Firefly builds absolute URLs from the hostname
# it believes it has; reached under a different one, its redirects cross
# origins, the browser withholds the session cookie, and searches hang.
# ${PUBLIC_HOST} is filled in from the container's environment at start-up.
server {
    listen 80 default_server;
    return 301 http://${PUBLIC_HOST}$request_uri;
}

server {
    listen 80;
    server_name ${PUBLIC_HOST} proxy localhost;
    client_max_body_size 600m;

    location = / { return 302 /firefly/; }

    location /firefly {
        proxy_pass http://firefly:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Firefly marks the cookies it sets on the WebSocket handshake
        # "Secure; SameSite=None".  Over plain HTTP a browser throws those
        # away (except on localhost), so the page's event channel and its
        # later requests end up with different user keys, and results of
        # background jobs never reach the page: searches appear to hang.
        # Drop the flags while this deployment has no TLS.  REMOVE THIS
        # once the site is served over HTTPS.
        proxy_cookie_flags ~ nosecure samesite=lax;
    }

    location /TAP {
        proxy_pass http://tap:80;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    location /workspace {
        proxy_pass http://tap:80;
        proxy_set_header Host $http_host;
    }
}
